<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyatomic Ion Study</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-sidebar: #111216;
            --bg-card: #181a1f;
            --bg-hover: #1e2128;
            --text-main: #e2e2e2;
            --text-muted: #8b8f98;
            --border-color: #2a2d35;
            --accent-blue: #2f65f6;
            --priority-red: #e72c2c;
            --priority-orange: #dd9c00;
            --priority-yellow: #ffe722;
            --priority-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
}

        .nav-section {
            flex: 1;
            overflow-y: auto;
        }

        .section-title {
            font-size: 16px;
            color: var(--text-muted);
            padding: 0 20px 10px;
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            border-left: 3px solid transparent;
            transition: background-color 0.2s;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: rgba(47, 101, 246, 0.1);
            border-left-color: var(--accent-blue);
            color: var(--text-main);
        }

        .nav-icon {
            margin-right: 12px;
        }

        .nav-progress {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-section {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .progress-block {
            margin-bottom: 15px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-blue);
            transition: width 0.4s ease;
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 0 20px;
            transition: transform 0.3s ease;
        }

        .main-content {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .menu-btn {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .sort-dropdown {
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            width: fit-content;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .list-item {
            border-bottom: 1px solid var(--border-color);
        }

        .item-header {
            display: flex;
            align-items: center;
            padding: 16px 0;
            cursor: pointer;
        }

        .priority-container {
            position: relative;
            padding: 5px 15px 5px 0;
        }

        .priority-bar {
            width: 12px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .priority-bar::before {
            content: "❯";
            color: rgba(255,255,255,1);
            font-size: 14px;
            line-height: 1;
        }

        .priority-bar:hover {
            transform: scale(1.3);
        }

        .item-title {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
        }

        .chevron {
            color: var(--text-muted);
            transition: transform 0.3s ease;
            font-size: 24px;
        }

        .list-item.expanded .chevron {
            transform: rotate(90deg);
        }

        .item-details {
            display: none;
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .list-item.expanded .item-details {
            display: block;
        }

        .item-details:focus {
            border-color: var(--accent-blue);
            outline: none;
        }

        .color-picker {
            display: none;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1f2229;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            z-index: 100;
            gap: 10px;
        }

        .color-picker.active {
            display: flex;
        }

        .color-option {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }

        .color-option:hover {
            transform: scale(1.2);
        }

        .priority-red .priority-bar { background-color: var(--priority-red); }
        .priority-red .item-title { color: var(--priority-red); }
        .priority-orange .priority-bar { background-color: var(--priority-orange); }
        .priority-orange .item-title { color: var(--priority-orange); }
        .priority-yellow .priority-bar { background-color: var(--priority-yellow); }
        .priority-yellow .item-title { color: var(--priority-yellow); }
        .priority-green .priority-bar { background-color: var(--priority-green); }
        .priority-green .item-title { color: var(--priority-green); }

        .opt-red { background-color: var(--priority-red); }
        .opt-orange { background-color: var(--priority-orange); }
        .opt-yellow { background-color: var(--priority-yellow); }
        .opt-green { background-color: var(--priority-green); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .nav-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 8px 20px;
            list-style: none;
        }

        .nav-section-title {
            list-style: none;
            font-size: 13px;
            color: var(--text-muted);
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flashcard-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flash-btn {
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .flash-btn:hover {
            background-color: var(--bg-hover);
        }

        .flashcard-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .flashcard-counter {
            color: var(--text-muted);
            font-size: 14px;
        }

        .flashcard-scene {
            width: min(520px, 90%);
            height: 300px;
            perspective: 1200px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .flashcard-inner.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
        }

        .flashcard-back {
            transform: rotateY(180deg);
        }

        .flashcard-label {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .flashcard-text {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            color: var(--text-main);
            line-height: 1.3;
            word-break: break-word;
        }

        .flashcard-formula {
            font-family: "SF Mono", Consolas, Menlo, monospace;
            font-size: 30px;
            color: var(--accent-blue);
        }

        .flashcard-hint {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .flashcard-nav {
            display: flex;
            gap: 12px;
        }

        .flash-nav-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .flash-nav-btn:hover {
            background-color: var(--bg-hover);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transform: translateX(-100%);
            }

            body.sidebar-open .sidebar {
                transform: translateX(0);
            }

            body.sidebar-open .sidebar-overlay {
                display: block;
            }

            .main-content {
                padding: 20px;
            }

            .menu-btn {
                display: block;
            }

            .progress-section {
                display: none;
            }

            .sidebar .progress-section {
                            display: block;
                        }
                    }

                    /* ============ LEARN MODE ============ */
                    .learn-container {
                        flex: 1;
                        min-height: 0;
                        display: flex;
                        flex-direction: column;
                        max-width: 720px;
                        width: 100%;
                        margin: 0 auto;
                    }

                    .learn-topbar {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        margin-bottom: 28px;
                    }

                    .learn-progress {
                        height: 6px;
                        background-color: var(--border-color);
                        border-radius: 3px;
                        overflow: hidden;
                    }

                    .learn-progress-fill {
                        height: 100%;
                        background-color: var(--accent-blue);
                        border-radius: 3px;
                        transition: width 0.4s ease;
                        width: 0%;
                    }

                    .learn-status {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        color: var(--text-muted);
                        font-size: 14px;
                    }

                    .learn-counter {
                        font-weight: 600;
                    }

                    .learn-controls {
                        display: flex;
                        gap: 8px;
                    }

                    .learn-btn {
                        background-color: var(--bg-main);
                        color: var(--text-main);
                        border: 1px solid var(--border-color);
                        padding: 7px 14px;
                        border-radius: 6px;
                        font-size: 14px;
                        cursor: pointer;
                    }

                    .learn-btn:hover {
                        background-color: var(--bg-hover);
                    }

                    .learn-btn.primary {
                        background-color: var(--accent-blue);
                        border-color: var(--accent-blue);
                        color: #fff;
                        font-weight: 600;
                    }

                    .learn-btn.ghost {
                        background: transparent;
                    }

                    .learn-btn.starred {
                        color: var(--priority-yellow);
                    }

                    .learn-screen {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                    }

                    /* settings / intro */
                    .learn-intro {
                        text-align: center;
                        padding: 30px 0 10px;
                    }

                    .learn-intro h2 {
                        font-size: 26px;
                        font-weight: 600;
                        margin-bottom: 8px;
                    }

                    .learn-intro p {
                        color: var(--text-muted);
                        font-size: 15px;
                        margin-bottom: 4px;
                    }

                    .learn-settings-panel {
                        background-color: var(--bg-card);
                        border: 1px solid var(--border-color);
                        border-radius: 14px;
                        padding: 26px 30px 30px;
                        width: 100%;
                        max-width: 560px;
                        margin: 24px 0 8px;
                        text-align: left;
                    }

                    .learn-setting-row {
                        margin-bottom: 20px;
                    }

                    .learn-setting-row:last-child {
                        margin-bottom: 0;
                    }

                    .learn-setting-label {
                        font-size: 14px;
                        font-weight: 600;
                        color: var(--text-main);
                        margin-bottom: 10px;
                    }

                    .learn-setting-hint {
                        font-size: 12px;
                        color: var(--text-muted);
                        margin-top: 6px;
                    }

                    .learn-seg {
                        display: flex;
                        gap: 8px;
                        flex-wrap: wrap;
                    }

                    .learn-seg-btn {
                        background-color: var(--bg-main);
                        color: var(--text-main);
                        border: 1px solid var(--border-color);
                        padding: 10px 16px;
                        border-radius: 8px;
                        font-size: 14px;
                        cursor: pointer;
                        flex: 1;
                        min-width: 130px;
                        text-align: center;
                    }

                    .learn-seg-btn:hover {
                        background-color: var(--bg-hover);
                    }

                    .learn-seg-btn.selected {
                        background-color: rgba(47, 101, 246, 0.18);
                        border-color: var(--accent-blue);
                        color: #fff;
                    }

                    .learn-start-row {
                                            display: flex;
                                            align-items: center;
                                            justify-content: center;
                                            gap: 12px;
                                            margin-top: 22px;
                                        }

                                        .learn-start-btn {
                                            padding: 13px 40px;
                                            font-size: 16px;
                                        }

                    .learn-question {
                        width: 100%;
                        max-width: 560px;
                        background-color: var(--bg-card);
                        border: 1px solid var(--border-color);
                        border-radius: 14px;
                        padding: 36px;
                        text-align: center;
                        min-height: 180px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        gap: 16px;
                    }

                    .learn-label {
                        font-size: 12px;
                        letter-spacing: 2px;
                        text-transform: uppercase;
                        color: var(--text-muted);
                    }

                    .learn-prompt {
                        font-size: 26px;
                        font-weight: 600;
                        color: var(--text-main);
                        line-height: 1.3;
                        word-break: break-word;
                    }

                    .learn-prompt.formula {
                        font-family: "SF Mono", Consolas, Menlo, monospace;
                        color: var(--accent-blue);
                        font-size: 32px;
                    }

                    /* multiple choice */
                    .learn-options {
                        width: 100%;
                        max-width: 560px;
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 10px;
                        margin-top: 16px;
                    }

                    .learn-option {
                        background-color: var(--bg-card);
                        color: var(--text-main);
                        border: 1px solid var(--border-color);
                        border-radius: 10px;
                        padding: 18px 20px;
                        font-size: 15px;
                        cursor: pointer;
                        text-align: center;
                        transition: background-color 0.15s, border-color 0.15s;
                        word-break: break-word;
                        line-height: 1.3;
                    }

                    .learn-option:hover:not(:disabled) {
                        background-color: var(--bg-hover);
                    }

                    .learn-option.correct {
                        background-color: rgba(46, 204, 113, 0.16);
                        border-color: var(--priority-green);
                        color: var(--priority-green);
                    }

                    .learn-option.wrong {
                        background-color: rgba(231, 44, 44, 0.16);
                        border-color: var(--priority-red);
                        color: var(--priority-red);
                    }

                    .learn-option:disabled {
                        cursor: default;
                    }

                    /* written answer */
                    .learn-written {
                        width: 100%;
                        max-width: 560px;
                        display: flex;
                        gap: 10px;
                        margin-top: 16px;
                    }

                    .learn-input {
                        flex: 1;
                        background-color: var(--bg-card);
                        color: var(--text-main);
                        border: 1px solid var(--border-color);
                        border-radius: 10px;
                        padding: 16px 18px;
                        font-size: 17px;
                        outline: none;
                    }

                    .learn-input:focus {
                        border-color: var(--accent-blue);
                    }

                    .learn-answer-btn {
                        background-color: var(--accent-blue);
                        color: #fff;
                        border: none;
                        border-radius: 10px;
                        padding: 0 26px;
                        font-size: 15px;
                        font-weight: 600;
                        cursor: pointer;
                    }

                    .learn-answer-btn:disabled {
                        opacity: 0.5;
                        cursor: default;
                    }

                    /* feedback / continue */
                    .learn-feedback {
                        margin-top: 18px;
                        width: 100%;
                        max-width: 560px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        gap: 12px;
                    }

                    .learn-feedback-msg {
                        font-size: 16px;
                        font-weight: 600;
                        text-align: center;
                    }

                    .learn-feedback-msg .correct { color: var(--priority-green); }
                    .learn-feedback-msg .incorrect { color: var(--priority-red); }

                    .learn-feedback-answer {
                        color: var(--text-muted);
                        font-size: 14px;
                        text-align: center;
                    }

                    .learn-feedback-btn {
                        background-color: var(--accent-blue);
                        color: #fff;
                        border: none;
                        border-radius: 8px;
                        padding: 12px 34px;
                        font-size: 15px;
                        font-weight: 600;
                        cursor: pointer;
                    }

                    .learn-feedback-btn:hover {
                        opacity: 0.9;
                    }

.learn-keys {
                            color: var(--text-muted);
                            font-size: 12px;
                            opacity: 0.6;
                            margin-top: 12px;
                        }

                        .learn-term-chips {
                            display: flex;
                            flex-wrap: wrap;
                            justify-content: center;
                            gap: 5px;
                            width: 100%;
                            max-width: 560px;
                            margin: 0 auto 18px;
                        }

                        .learn-chip {
                            width: 9px;
                            height: 20px;
                            border-radius: 3px;
                            background-color: var(--border-color);
                            transition: background-color 0.3s;
                        }

                        .learn-chip.partial {
                            background-color: var(--priority-yellow);
                        }

                        .learn-chip.done {
                            background-color: var(--priority-green);
                        }

                        .learn-reveal-row {
                            margin-top: 14px;
                            width: 100%;
                            max-width: 560px;
                            display: flex;
                            justify-content: center;
                        }

                        /* results */
                    .learn-results {
                        max-width: 560px;
                        width: 100%;
                        background-color: var(--bg-card);
                        border: 1px solid var(--border-color);
                        border-radius: 14px;
                        padding: 40px;
                        text-align: center;
                    }

                    .learn-results h2 {
                        font-size: 28px;
                        font-weight: 700;
                        margin-bottom: 6px;
                    }

                    .learn-results-sub {
                        color: var(--text-muted);
                        font-size: 15px;
                        margin-bottom: 26px;
                    }

                    .learn-results-stats {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 12px;
                        margin-bottom: 26px;
                    }

                    .learn-stat {
                        background-color: var(--bg-main);
                        border: 1px solid var(--border-color);
                        border-radius: 10px;
                        padding: 18px;
                    }

                    .learn-stat-value {
                        font-size: 26px;
                        font-weight: 700;
                    }

                    .learn-stat-value.good { color: var(--priority-green); }
                    .learn-stat-value.bad { color: var(--priority-red); }

                    .learn-stat-label {
                        font-size: 12px;
                        color: var(--text-muted);
                        margin-top: 4px;
                    }

                    .learn-results-actions {
                        display: flex;
                        gap: 10px;
                        justify-content: center;
                        flex-wrap: wrap;
                    }

                    .learn-missed {
                        margin-top: 20px;
                        text-align: left;
                        background-color: var(--bg-main);
                        border: 1px solid var(--border-color);
                        border-radius: 10px;
                        padding: 16px 20px;
                    }

                    .learn-missed-title {
                        font-size: 13px;
                        color: var(--text-muted);
                        text-transform: uppercase;
                        letter-spacing: 1px;
                        margin-bottom: 10px;
                    }

                    .learn-missed-item {
                        display: flex;
                        justify-content: space-between;
                        gap: 12px;
                        padding: 6px 0;
                        border-bottom: 1px solid var(--border-color);
                        font-size: 14px;
                    }

                    .learn-missed-item:last-child {
                        border-bottom: none;
                    }

                    .learn-missed-term { color: var(--text-main); }
                    .learn-missed-def { color: var(--text-muted); }

                    @media (max-width: 560px) {
                        .learn-options {
                            grid-template-columns: 1fr;
                        }
                    }
                </style>
</head>
<body>
    <div class="sidebar-overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar">
        <nav class="nav-section">
            <div class="section-title">Categories</div>
            <ul class="nav-list" id="sidebar-list"></ul>
        </nav>

        <div class="progress-section">
            <div class="progress-block">
                <div class="progress-header">
                    <span>Category Progress</span>
                    <span id="cat-progress-text">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="cat-progress-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="progress-block">
                <div class="progress-header">
                    <span>Overall Progress</span>
                    <span id="overall-progress-text">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="overall-progress-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <div class="header-top">
                <button class="menu-btn" onclick="openMenu()">☰</button>
                <h1 id="category-title">All Words</h1>
            </div>
            <div class="header-controls">
                <select class="sort-dropdown" id="sort-select" onchange="handleSortChange()">
                    <option value="high-low">Priority (High → Low)</option>
                    <option value="low-high">Priority (Low → High)</option>
                    <option value="a-z">Alphabetical (A → Z)</option>
                </select>

                { id: "ka_5", term: "Oxide", definition: "O(2-)" },
                { id: "ka_6", term: "Perbromate", definition: "BrO4(-)" },
                { id: "ka_7", term: "Perchlorate", definition: "ClO4(-)" },
                { id: "ka_8", term: "Permanganate", definition: "MnO4(-)" },

                { id: "ka_18", term: "Thiosulfate", definition: "S2O3(2-)" }

        let state = {
            activeCategory: "all",
            sortMethod: "high-low",
            appData: structuredClone(DATA),
            expandedItems: new Set(),
            mode: "list",
            flashItems: [],
            flashIndex: 0,
            flashFlipped: false
        };

        function openMenu() { document.body.classList.add('sidebar-open'); }
        function closeMenu() { document.body.classList.remove('sidebar-open'); }

        function getAllItems() {
            return Object.values(state.appData).flat();
        }

        function getCategoryItems(categoryId) {
            return categoryId === "all" ? getAllItems() : state.appData[categoryId] || [];
        }

        function calculateProgress(items) {
            if (!items.length) return 0;
            const score = items.reduce((sum, item) => sum + PRIORITY_ORDER[getPriority(item)], 0);
            return Math.round((score / (items.length * 3)) * 100);
        }

        function loadFromStorage() {
                    const savedPriority = JSON.parse(localStorage.getItem('studyAppProgress') || '{}');
                    const savedDefs = JSON.parse(localStorage.getItem('studyAppDefinitionChanges') || '{}');
                    const savedStars = JSON.parse(localStorage.getItem('studyAppStars') || '{}');
                    const savedSort = localStorage.getItem('studyAppSort');

                    for (let catId in savedPriority) {
                        if (state.appData[catId]) {
                            state.appData[catId].forEach(item => {
                                if (savedPriority[catId][item.id]) {
                                    item.priority = savedPriority[catId][item.id];
                                }
                            });
                        }
                    }

                    for (let catId in savedDefs) {
                        if (state.appData[catId]) {
                            state.appData[catId].forEach(item => {
                                if (savedDefs[catId][item.id]) {
                                    item.definition = savedDefs[catId][item.id];
                                }
                            });
                        }
                    }

                    for (let catId in savedStars) {
                        if (state.appData[catId]) {
                            state.appData[catId].forEach(item => {
                                if (savedStars[catId][item.id]) {
                                    item.starred = true;
                                }
                            });
                        }
                    }

                    if (savedSort) {
                        state.sortMethod = savedSort;
                        document.getElementById('sort-select').value = savedSort;
                    }
                }

        function saveToStorage() {
                    const priorityData = {};
                    const defData = {};
                    const starData = {};

                    for (let catId in state.appData) {
                        priorityData[catId] = {};
                        defData[catId] = {};
                        starData[catId] = {};
                        state.appData[catId].forEach(item => {
                            if (item.priority && item.priority !== DEFAULT_PRIORITY) priorityData[catId][item.id] = item.priority;
                            defData[catId][item.id] = item.definition;
                            if (item.starred) starData[catId][item.id] = true;
                        });
                    }

                    localStorage.setItem('studyAppProgress', JSON.stringify(priorityData));
                    localStorage.setItem('studyAppDefinitionChanges', JSON.stringify(defData));
                    localStorage.setItem('studyAppStars', JSON.stringify(starData));
                }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-list');
            sidebar.innerHTML = '';
            const totalWords = getAllItems().length;

            CATEGORIES.forEach(cat => {
                const li = document.createElement('li');
                const displayName = cat.id === "all" ? `All ${totalWords} Words` : cat.name;
                const progress = calculateProgress(getCategoryItems(cat.id));

                li.className = `nav-item ${cat.id === state.activeCategory ? 'active' : ''}`;
                li.innerHTML = `<span class="nav-icon">${cat.icon}</span>${displayName}<span class="nav-progress">${progress}%</span>`;
                li.onclick = () => switchCategory(cat.id);
                sidebar.appendChild(li);
            });

            const divider = document.createElement('li');
            divider.className = 'nav-divider';
            sidebar.appendChild(divider);

            const sectionTitle = document.createElement('li');
            sectionTitle.className = 'nav-section-title';
            sectionTitle.innerText = 'Study Tools';
            sidebar.appendChild(sectionTitle);

            const fc = document.createElement('li');
                        fc.className = `nav-item ${state.mode === 'flashcards' ? 'active' : ''}`;
                        fc.innerHTML = `<span class="nav-icon">🃏</span>Flashcards<span class="nav-progress">${calculateProgress(getCategoryItems(state.activeCategory))}%</span>`;
                        fc.onclick = () => openFlashcards();
                        sidebar.appendChild(fc);

                        const ln = document.createElement('li');
                        ln.className = `nav-item ${state.mode === 'learn' ? 'active' : ''}`;
                        ln.innerHTML = `<span class="nav-icon">🎯</span>Learn<span class="nav-progress"></span>`;
                        ln.onclick = () => openLearn();
                        sidebar.appendChild(ln);
        }

        function switchCategory(categoryId) {
            state.activeCategory = categoryId;
            state.expandedItems.clear();
            state.mode = "list";
            closeMenu();

            const cat = CATEGORIES.find(c => c.id === categoryId);
            const title = categoryId === "all" ? `All ${getAllItems().length} Words` : cat.name;
            document.getElementById('category-title').innerText = title;

            renderSidebar();
            renderList();
            updateProgress();
        }

        function renderList() {
            document.getElementById('main-list-container').style.display = '';
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('sort-select').style.display = '';
            document.getElementById('flashcard-controls').style.display = 'none';

            const container = document.getElementById('main-list-container');
            container.innerHTML = '';

            const items = sortItems(getCategoryItems(state.activeCategory), state.sortMethod);

            if (!items.length) {
                container.innerHTML = '<div style="padding: 20px; color: var(--text-muted);">No terms in this category.</div>';
                return;
            }

            items.forEach(item => {
                const priority = getPriority(item);
                const isExpanded = state.expandedItems.has(item.id);
                const div = document.createElement('div');
                div.className = `list-item priority-${priority} ${isExpanded ? 'expanded' : ''}`;
                div.innerHTML = `
                    <div class="item-header" onclick="toggleAccordion('${item.id}', this)">
                        <div class="priority-container">
                            <div class="priority-bar" onclick="openColorPicker(event, this)"></div>
                            <div class="color-picker">
                                ${['red', 'orange', 'yellow', 'green'].map(c => `<div class="color-option opt-${c}" onclick="setColor(event, '${item.id}', '${c}')"></div>`).join('')}
                            </div>
                        </div>
                        <span class="item-title">${item.term}</span>
                        <span class="chevron">›</span>
                    </div>
                    <div class="item-details" contenteditable="true" spellcheck="false" onblur="saveDefinition(event, '${item.id}', this.innerText)" onclick="event.stopPropagation()">${item.definition}</div>
                `;
                container.appendChild(div);
            });
        }

        function toggleAccordion(itemId, headerEl) {
            const listItem = headerEl.closest('.list-item');
            if (state.expandedItems.has(itemId)) {
                state.expandedItems.delete(itemId);
                listItem.classList.remove('expanded');
            } else {
                state.expandedItems.add(itemId);
                listItem.classList.add('expanded');
            }
        }

        function openColorPicker(event, el) {
            event.stopPropagation();
            closeAllColorPickers();
            el.nextElementSibling.classList.add('active');
        }

        function setColor(event, itemId, color) {
            event.stopPropagation();
            getAllItems().find(i => i.id === itemId).priority = color;
            saveToStorage();
            renderList();
            updateProgress();
            closeAllColorPickers();
        }

        function saveDefinition(event, itemId, newText) {
            const item = getAllItems().find(i => i.id === itemId);
            if (item && item.definition !== newText) {
                item.definition = newText;
                saveToStorage();
                updateProgress();
            }
        }

        function handleSortChange() {
            state.sortMethod = document.getElementById('sort-select').value;
            localStorage.setItem('studyAppSort', state.sortMethod);
            renderList();
        }

        function initFlashControls() {
            const select = document.getElementById('flashcat-select');
            CATEGORIES.forEach(cat => {
                const opt = document.createElement('option');
                const label = cat.id === "all" ? `All ${getAllItems().length} Words` : cat.name;
                opt.value = cat.id;
                opt.textContent = label;
                select.appendChild(opt);
            });
        }

        function rebuildFlashDeck() {
            state.flashItems = sortItems(getCategoryItems(state.activeCategory), state.sortMethod);
            state.flashIndex = 0;
            state.flashFlipped = false;
        }

        function openFlashcards() {
            state.mode = "flashcards";
            closeMenu();
            rebuildFlashDeck();
            renderSidebar();
            renderFlashcards();
            updateProgress();
        }

        function handleFlashCategoryChange() {
            state.activeCategory = document.getElementById('flashcat-select').value;
            rebuildFlashDeck();
            renderSidebar();
            renderFlashcards();
            updateProgress();
        }

        function renderFlashcards() {
            document.getElementById('main-list-container').style.display = 'none';
            document.getElementById('flashcard-container').style.display = 'flex';
            document.getElementById('sort-select').style.display = 'none';
            document.getElementById('flashcard-controls').style.display = '';

            document.getElementById('flashcat-select').value = state.activeCategory;

            const cat = CATEGORIES.find(c => c.id === state.activeCategory);
            const title = state.activeCategory === "all"
                ? `Flashcards — All ${getAllItems().length} Words`
                : `Flashcards — ${cat.name}`;
            document.getElementById('category-title').innerText = title;

            const deck = state.flashItems;
            const showEmpty = !deck.length;
            document.getElementById('flashcard-empty').style.display = showEmpty ? 'block' : 'none';
            ['flash-counter', 'flashcard-scene', 'flash-nav'].forEach(id => {
                document.getElementById(id).style.display = showEmpty ? 'none' : '';
            });
            if (showEmpty) {
                document.getElementById('flashcard-empty').innerText = 'No ions in this category.';
                return;
            }

            const item = deck[state.flashIndex];
            document.getElementById('flash-front-text').innerText = item.term;
            document.getElementById('flash-back-text').innerText = item.definition;
            document.getElementById('flash-counter').innerText = `${state.flashIndex + 1} / ${deck.length}`;
            document.getElementById('flashcard-inner').classList.toggle('flipped', state.flashFlipped);
        }

        function toggleFlip() {
            if (!state.flashItems.length) return;
            state.flashFlipped = !state.flashFlipped;
            document.getElementById('flashcard-inner').classList.toggle('flipped', state.flashFlipped);
        }

        function flashNext() {
            if (!state.flashItems.length) return;
            state.flashIndex = (state.flashIndex + 1) % state.flashItems.length;
            state.flashFlipped = false;
            renderFlashcards();
        }

        function flashPrev() {
            if (!state.flashItems.length) return;
            state.flashIndex = (state.flashIndex - 1 + state.flashItems.length) % state.flashItems.length;
            state.flashFlipped = false;
            renderFlashcards();
        }

        function shuffleFlashcards() {
                    if (state.flashItems.length < 2) return;
                    for (let i = state.flashItems.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [state.flashItems[i], state.flashItems[j]] = [state.flashItems[j], state.flashItems[i]];
                    }
                    state.flashIndex = 0;
                    state.flashFlipped = false;
                    renderFlashcards();
                }

                /* ==================== LEARN MODE (Quizlet-style) ==================== */
                const LEARN_MODES = { MC: "mc", WRITE: "write", STAR: "star", ONCE: "once" };
                const LEARN_ANSWER_TYPES = { TERM: "term", DEFINITION: "definition" };

                let learnState = {
                    settings: { mode: LEARN_MODES.MC, answerType: "mc" },
                    screen: "settings",          // settings | question | results
                    deck: [],                    // learn deck of item copies still in rotation
                    order: [],                   // original (shuffled) order for the progress chips
                    totalTerms: 0,               // starting deck size
                    totalAnswered: 0,
                    correctCount: 0,
                    firstTryCorrect: 0,
                    streak: 0,
                    bestStreak: 0,
                    wrongItems: [],              // all missed item ids, in order (for the review list)
                    incorrectSet: new Set(),     // distinct missed ids (for results summary)
                    current: null,               // { item, options, userAnswer, answered, correct }
                    questionMode: LEARN_ANSWER_TYPES.TERM // 'term' | 'definition'
                };

                function learnSettings() {
                    return {
                        mode: learnState.settings.mode,
                        answerType: learnState.settings.answerType,
                        questionMode: learnState.questionMode
                    };
                }

                function shuffleArr(arr) {
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    return arr;
                }

                function openLearn() {
                    state.mode = "learn";
                    closeMenu();
                    learnState.screen = "settings";
                    renderSidebar();
                    renderLearn();
                    updateProgress();
                }

                function learnCategoryItems() {
                    return getCategoryItems(state.activeCategory);
                }

                function learnDisplayName() {
                    const cat = CATEGORIES.find(c => c.id === state.activeCategory);
                    return state.activeCategory === "all" ? `All ${learnCategoryItems().length} Words` : cat.name;
                }

                function renderLearn() {
                    document.getElementById('main-list-container').style.display = 'none';
                    document.getElementById('flashcard-container').style.display = 'none';
                    document.getElementById('sort-select').style.display = 'none';
                    document.getElementById('flashcard-controls').style.display = 'none';
                    document.getElementById('learn-container').style.display = 'flex';

                    document.getElementById('category-title').innerText = `Learn — ${learnDisplayName()}`;

                    const showTopbar = learnState.screen === "question";
                    document.getElementById('learn-topbar').style.display = showTopbar ? 'flex' : 'none';

                    const screen = document.getElementById('learn-screen');
                    screen.innerHTML = '';

                    if (learnState.screen === "settings") renderLearnSettings(screen);
                    else if (learnState.screen === "results") renderLearnResults(screen);
                    // "question" is rendered by learnNext()/learnShowQuestion()
                }

                function renderLearnSettings(screen) {
                    const starredCount = learnCategoryItems().filter(i => i.starred).length;
                    screen.innerHTML = `
                        <div class="learn-intro">
                            <h2>🎯 Learn</h2>
                            <p>Study the ${learnDisplayName()} set. Answer until you get them all right.</p>
                        </div>

                        <div class="learn-settings-panel">
                            <div class="learn-setting-row">
                                <div class="learn-setting-label">Answer with</div>
                                <div class="learn-seg" id="learn-answertype-seg">
                                    <button class="learn-seg-btn ${learnState.settings.answerType === "mc" ? 'selected' : ''}" onclick="learnSetAnswerType('mc')">Multiple choice</button>
                                    <button class="learn-seg-btn ${learnState.settings.answerType === "write" ? 'selected' : ''}" onclick="learnSetAnswerType('write')">Written answer</button>
                                </div>
                                <div class="learn-setting-hint">Multiple choice — pick the matching side from 4 options. Written — type the answer.</div>
                            </div>

                            <div class="learn-setting-row">
                                <div class="learn-setting-label">Which terms</div>
                                <div class="learn-seg" id="learn-mode-seg">
                                    <button class="learn-seg-btn ${learnState.settings.mode === LEARN_MODES.MC ? 'selected' : ''}" onclick="learnSetMode('mc')">All terms</button>
                                    <button class="learn-seg-btn ${learnState.settings.mode === LEARN_MODES.STAR ? 'selected' : ''}" onclick="learnSetMode('star')">Starred only (${starredCount})</button>
                                    <button class="learn-seg-btn ${learnState.settings.mode === LEARN_MODES.ONCE ? 'selected' : ''}" onclick="learnSetMode('once')">Repeat until mastered</button>
                                </div>
                                <div class="learn-setting-hint">All terms — wrong answers come back until you get them right. Starred only — only ⭐ terms. Repeat until mastered — every term repeats until you answer it correctly twice in a row.</div>
                            </div>

                            <div class="learn-start-row">
                                <button class="learn-start-btn learn-btn primary" onclick="learnStart()">Start</button>
                            </div>
                        </div>
                    `;
                }

                function learnSetMode(m) {
                    learnState.settings.mode = m;
                    renderLearn();
                }

                function learnSetAnswerType(t) {
                    learnState.settings.answerType = t;
                    renderLearn();
                }

                function learnPickQuestionMode() {
                    if (learnState.settings.answerType === "write") {
                        learnState.questionMode = (learnState.totalAnswered % 2 === 0) ? LEARN_ANSWER_TYPES.TERM : LEARN_ANSWER_TYPES.DEFINITION;
                    } else {
                        learnState.questionMode = Math.random() < 0.5 ? LEARN_ANSWER_TYPES.TERM : LEARN_ANSWER_TYPES.DEFINITION;
                    }
                }

                function learnDecayScore(item) {
                    if (item._correctStreak >= 4) return 0.2;
                    if (item._correctStreak >= 3) return 0.35;
                    if (item._correctStreak >= 2) return 0.55;
                    if (item._correctStreak === 1) return 0.75;
                    return 1;
                }

                function learnIsMastered(item) {
                    if (learnState.settings.mode === LEARN_MODES.ONCE) return item._correctStreak >= 2;
                    return true;
                }

                function learnBuildDeck() {
                    const src = learnCategoryItems().map(i => ({ ...i, _correctStreak: 0, _correct: 0, _attempts: 0 }));
                    if (learnState.settings.mode === LEARN_MODES.STAR) return src.filter(i => i.starred);
                    return src;
                }

                function learnStart() {
                    const deck = learnBuildDeck();
                    if (!deck.length) {
                        alert(learnState.settings.mode === LEARN_MODES.STAR
                            ? "No starred terms in this category. Star some terms (☆ Star) first."
                            : "No terms to learn in this category.");
                        return;
                    }

                    learnState.screen = "question";
                    learnState.deck = deck;
                    learnState.totalTerms = deck.length;
                    learnState.totalAnswered = 0;
                    learnState.correctCount = 0;
                    learnState.firstTryCorrect = 0;
                    learnState.streak = 0;
                    learnState.bestStreak = 0;
                    learnState.wrongItems = [];
                    learnState.incorrectSet = new Set();

                    shuffleArr(learnState.deck);
                    learnState.order = learnState.deck.slice();

                    renderSidebar();
                    renderLearn();
                    learnNext();
                }

                function learnAnswerIsTerm() {
                    return learnState.questionMode === LEARN_ANSWER_TYPES.TERM;
                }

                function learnQuestion(item) {
                    const showTerm = learnAnswerIsTerm();
                    return {
                        prompt: showTerm ? item.term : item.definition,
                        answer: showTerm ? item.definition : item.term
                    };
                }

                function learnBuildOptions(item) {
                    const count = Math.max(2, Math.min(4, learnState.deck.length));
                    const others = shuffleArr(learnState.deck.filter(o => o.id !== item.id));
                    const picks = others.slice(0, count - 1);
                    const correct = learnQuestion(item).answer;
                    return shuffleArr([correct, ...picks.map(o => (learnAnswerIsTerm() ? o.definition : o.term))]);
                }

                function learnShowQuestion() {
                    const item = learnState.current.item;
                    if (!item) return;

                    const ans = learnQuestion(item);
                    const isTerm = learnAnswerIsTerm();

                    document.getElementById('learn-topbar').style.display = 'flex';
                    const pct = learnState.totalTerms ? Math.round(((learnState.totalTerms - learnState.deck.length) / learnState.totalTerms) * 100) : 0;
                    document.getElementById('learn-progress-fill').style.width = pct + '%';
                    document.getElementById('learn-counter').innerText = `${learnState.totalAnswered} answered · ${learnState.deck.length} left`;

                    const star = document.getElementById('learn-star');
                    star.classList.toggle('starred', !!item.starred);
                    star.innerText = item.starred ? '⭐ Starred' : '☆ Star';

                    const screen = document.getElementById('learn-screen');
                    screen.innerHTML = '';

                    const chips = learnTermChipsHtml();
                    if (chips) screen.insertAdjacentHTML('beforeend', chips);

                    const container = document.createElement('div');
                    container.className = 'learn-question-wrap';

                    const q = document.createElement('div');
                    q.className = 'learn-question';
                    q.innerHTML = `
                        <div class="learn-label">${isTerm ? 'TERM' : 'DEFINITION'}</div>
                        <div class="learn-prompt${isTerm ? '' : ' formula'}">${escapeHtml(ans.prompt)}</div>
                    `;
                    container.appendChild(q);

                    if (learnState.settings.answerType === "mc") {
                        const opts = learnBuildOptions(item);
                        const wrapper = document.createElement('div');
                        wrapper.className = 'learn-options';
                        container.appendChild(wrapper);
                        learnState.current.options = opts;
                        opts.forEach(o => {
                            const b = document.createElement('button');
                            b.className = 'learn-option';
                            b.innerText = o;
                            b.onclick = () => learnPickMC(o, b);
                            wrapper.appendChild(b);
                        });
                    } else {
                        const w = document.createElement('div');
                        w.className = 'learn-written';
                        w.innerHTML = `
                            <input class="learn-input" id="learn-input" type="text" placeholder="Type the ${isTerm ? 'definition' : 'term'}…" autocomplete="off" spellcheck="false" autocapitalize="off">
                            <button class="learn-answer-btn" onclick="checkWritten()">Check</button>
                        `;
                        container.appendChild(w);
                        const reveal = document.createElement('div');
                        reveal.className = 'learn-reveal-row';
                        reveal.innerHTML = `<button class="learn-btn ghost" onclick="learnReveal()">Can't remember</button>`;
                        container.appendChild(reveal);
                    }

                    screen.appendChild(container);

                    const keys = document.createElement('div');
                    keys.className = 'learn-keys';
                    keys.innerText = learnState.settings.answerType === "mc"
                        ? 'Keyboard: 1–4 or A–D to pick an answer'
                        : 'Keyboard: type your answer, Enter to check';
                    screen.appendChild(keys);

                    const inp = document.getElementById('learn-input');
                    if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkWritten(); }); }
                }

                function learnTermChipsHtml() {
                    if (!learnState.order || learnState.order.length < 2) return '';
                    return `<div class="learn-term-chips">${learnState.order.map(t => {
                        const s = learnChipStatus(t);
                        return `<div class="learn-chip ${s}" title="${escapeHtml(t.term)}"></div>`;
                    }).join('')}</div>`;
                }

                function learnChipStatus(item) {
                    const cur = learnState.deck.find(d => d.id === item.id);
                    if (!cur) return "done";
                    if (cur._correctStreak >= 1) return "partial";
                    return "todo";
                }

                function learnPickMC(choice, el) {
                    if (learnState.current.answered) return;
                    learnState.current.userAnswer = choice;
                    learnState.current.answered = true;
                    const isRight = choice === learnQuestion(learnState.current.item).answer;
                    learnState.current.correct = isRight;

                    const buttons = document.querySelectorAll('.learn-option');
                    const correctAnswer = learnQuestion(learnState.current.item).answer;
                    buttons.forEach(b => {
                        b.disabled = true;
                        if (b.innerText === correctAnswer) b.classList.add('correct');
                        else if (b.innerText === choice) b.classList.add('wrong');
                    });

                    learnResolve(isRight);
                }

                function checkWritten() {
                    const inp = document.getElementById('learn-input');
                    if (!inp) return;
                    const val = inp.value.trim();
                    if (!val) return;
                    if (learnState.current.answered) return;
                    learnState.current.userAnswer = val;
                    learnState.current.answered = true;
                    const isRight = learnCheckAnswer(val, learnState.current.item);
                    learnState.current.correct = isRight;
                    learnResolve(isRight);
                }

                function learnReveal() {
                    if (learnState.current.answered) return;
                    learnState.current.userAnswer = "I don't know";
                    learnState.current.answered = true;
                    learnState.current.correct = false;
                    learnResolve(false);
                }

                function learnCheckAnswer(user, item) {
                    const isTerm = learnAnswerIsTerm();
                    const target = isTerm ? item.definition : item.term;
                    const a = normalize(user);
                    const b = normalize(target);

                    if (a === b) return true;

                    if (isTerm) {
                        // typed a formula: allow spacing/parentheses differences if the core and charge match
                        const core = s => s.replace(/[()0-9+\-\s]/g, '').toLowerCase();
                        if (core(a) && core(a) === core(b)) {
                            const ca = extractCharge(a);
                            const cb = extractCharge(b);
                            if (ca !== null && cb !== null) return ca === cb;
                        }
                        return false;
                    }

                    // typed a term: allow omitting the "or <alias>" part
                    const beforeOr = b.split(' or ')[0].trim();
                    if (beforeOr && a === beforeOr) return true;
                    return false;
                }

                function extractCharge(s) {
                    const str = String(s).replace(/\s+/g, ' ').trim();
                    const tokens = str.split(/\s+/);
                    for (let i = tokens.length - 1; i >= 0; i--) {
                        const m = tokens[i].match(/^\(?(\d*)([+-])\)?$/);
                        if (m) return (m[1] || '1') + m[2];
                    }
                    const pm = str.match(/\((\d*)([+-])\)/);
                    if (pm) return (pm[1] || '1') + pm[2];
                    const tm = str.match(/(\d*)([+-])$/);
                    if (tm) {
                        const d = tm[1] || '1';
                        if (/^\d+$/.test(d) && +d <= 4) return d + tm[2];
                    }
                    return null;
                }

                function normalize(s) {
                    return String(s).toLowerCase().replace(/\s+/g, ' ').trim();
                }

                function learnResolve(isRight) {
                    const item = learnState.current.item;
                    learnState.totalAnswered++;
                    item._attempts++;
                    if (isRight) {
                        item._correct++;
                        item._correctStreak++;
                        learnState.correctCount++;
                        if (item._attempts === 1) learnState.firstTryCorrect++;
                        learnState.streak++;
                        if (learnState.streak > learnState.bestStreak) learnState.bestStreak = learnState.streak;
                        if (learnIsMastered(item)) {
                            learnState.deck = learnState.deck.filter(i => i.id !== item.id);
                        }
                    } else {
                        item._correctStreak = 0;
                        learnState.streak = 0;
                        learnState.incorrectSet.add(item.id);
                        learnState.wrongItems.push(item.id);
                    }
                    learnRenderFeedback(isRight);
                }

                function learnRenderFeedback(isRight) {
                    const item = learnState.current.item;
                    const screen = document.getElementById('learn-screen');

                    const msg = document.createElement('div');
                    msg.className = 'learn-feedback';

                    const m = document.createElement('div');
                    m.className = 'learn-feedback-msg';
                    m.innerHTML = isRight
                        ? `<span class="correct">Correct!${learnState.streak > 1 ? ` ${learnState.streak} streak` : ''}</span>`
                        : `<span class="incorrect">Not quite</span>`;
                    msg.appendChild(m);

                    if (!isRight) {
                        const a = document.createElement('div');
                        a.className = 'learn-feedback-answer';
                        a.innerHTML = `Correct answer: <b>${escapeHtml(learnState.questionMode === LEARN_ANSWER_TYPES.TERM ? item.definition : item.term)}</b>${learnState.current.userAnswer && learnState.current.userAnswer !== "I don't know" ? ` (you typed: ${escapeHtml(learnState.current.userAnswer)})` : ''}`;
                        msg.appendChild(a);
                    }

                    const btn = document.createElement('button');
                    btn.className = 'learn-feedback-btn';
                    btn.innerText = isRight ? 'Continue' : 'Got it — try again';
                    btn.onclick = () => learnAfterAnswer(isRight);
                    msg.appendChild(btn);

                    screen.appendChild(msg);
                    btn.focus();
                }

                function learnAfterAnswer() {
                    if (learnState.deck.length === 0) { learnFinish(); return; }
                    learnNext();
                }

                function learnNext() {
                    if (learnState.deck.length === 0) { learnFinish(); return; }
                    const pickIdx = learnPickWeightedIndex();
                    const item = learnState.deck[pickIdx];
                    learnState.current = { item, options: [], userAnswer: undefined, answered: false, correct: null };
                    learnPickQuestionMode();
                    learnShowQuestion();
                }

                function learnPickWeightedIndex() {
                    const weights = learnState.deck.map(i => learnDecayScore(i));
                    const total = weights.reduce((a, b) => a + b, 0);
                    let r = Math.random() * total;
                    for (let i = 0; i < weights.length; i++) {
                        r -= weights[i];
                        if (r <= 0) return i;
                    }
                    return weights.length - 1;
                }

                function learnFinish() {
                    learnState.screen = "results";
                    renderLearn();
                }

                function renderLearnResults(screen) {
                    document.getElementById('learn-topbar').style.display = 'none';
                    document.getElementById('learn-progress-fill').style.width = '100%';
                    document.getElementById('learn-counter').innerText = '';

                    const total = learnState.totalAnswered;
                    const acc = total ? Math.round((learnState.correctCount / total) * 100) : 0;
                    const missed = learnState.incorrectSet.size;
                    const learnedTerms = learnState.totalTerms;

                    screen.innerHTML = `
                        <div class="learn-results">
                            <h2>Learned! 🎉</h2>
                            <div class="learn-results-sub">You've mastered ${learnedTerms} ${learnedTerms === 1 ? 'term' : 'terms'} in the ${learnDisplayName()} set.</div>
                            <div class="learn-results-stats">
                                <div class="learn-stat"><div class="learn-stat-value ${acc >= 80 ? 'good' : acc < 60 ? 'bad' : ''}">${acc}%</div><div class="learn-stat-label">Accuracy</div></div>
                                <div class="learn-stat"><div class="learn-stat-value">${learnState.correctCount}</div><div class="learn-stat-label">Correct answers</div></div>
                                <div class="learn-stat"><div class="learn-stat-value">${learnState.bestStreak}</div><div class="learn-stat-label">Best streak</div></div>
                                <div class="learn-stat"><div class="learn-stat-value ${missed ? 'bad' : 'good'}">${missed}</div><div class="learn-stat-label">Missed</div></div>
                            </div>
                            <div class="learn-results-actions">
                                <button class="learn-btn primary" onclick="learnStart()">Restart</button>
                                <button class="learn-btn" onclick="openLearn()">Change settings</button>
                                <button class="learn-btn" onclick="switchCategory(state.activeCategory)">Back to list</button>
                            </div>
                            ${missed ? `<div class="learn-missed"><div class="learn-missed-title">Terms to review</div>${learnMissedHtml()}</div>` : ''}
                        </div>
                    `;
                }

                function learnMissedHtml() {
                    const all = getAllItems();
                    const seen = new Set();
                    let html = '';
                    learnState.wrongItems.forEach(id => {
                        if (seen.has(id)) return;
                        seen.add(id);
                        const it = all.find(x => x.id === id);
                        if (it) html += `<div class="learn-missed-item"><span class="learn-missed-term">${escapeHtml(it.term)}</span><span class="learn-missed-def">${escapeHtml(it.definition)}</span></div>`;
                    });
                    return html;
                }

                function learnEnd() {
                    if (!confirm('End the Learn session? Your progress so far will be shown.')) return;
                    learnFinish();
                }

                function learnToggleStar() {
                    if (!learnState.current || !learnState.current.item) return;
                    const it = getAllItems().find(x => x.id === learnState.current.item.id);
                    if (!it) return;
                    it.starred = !it.starred;
                    learnState.current.item.starred = it.starred;
                    saveToStorage();
                    const star = document.getElementById('learn-star');
                    star.classList.toggle('starred', it.starred);
                    star.innerText = it.starred ? '⭐ Starred' : '☆ Star';
                }

                function escapeHtml(s) {
                    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }

function sortItems(items, method) {
            const sorted = [...items];
            sorted.sort((a, b) => {
                let diff = 0;
                if (method === 'high-low') diff = PRIORITY_ORDER[getPriority(a)] - PRIORITY_ORDER[getPriority(b)];
                else if (method === 'low-high') diff = PRIORITY_ORDER[getPriority(b)] - PRIORITY_ORDER[getPriority(a)];
                else if (method === 'a-z') diff = a.term.localeCompare(b.term);

                if (diff !== 0) return diff;
                return (CATEGORY_ORDER[a.id.substring(0, 2)] || 99) - (CATEGORY_ORDER[b.id.substring(0, 2)] || 99);
            });
            return sorted;
        }

        function updateProgress() {
            const catItems = getCategoryItems(state.activeCategory);
            const catPercent = calculateProgress(catItems);

            document.getElementById('cat-progress-text').innerText = `${catPercent}%`;
            document.getElementById('cat-progress-bar').style.width = `${catPercent}%`;

            const overallPercent = calculateProgress(getAllItems());
            document.getElementById('overall-progress-text').innerText = `${overallPercent}%`;
            document.getElementById('overall-progress-bar').style.width = `${overallPercent}%`;
        }

        function closeAllColorPickers() {
            document.querySelectorAll('.color-picker').forEach(p => p.classList.remove('active'));
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('.priority-container')) closeAllColorPickers();
        });

        document.addEventListener('keydown', e => {
                    if (state.mode === "learn") {
                        if (learnState.screen !== "question" || !learnState.current) return;
                        if (learnState.current.answered) {
                            // feedback shown; Enter continues
                            if (e.key === "Enter") { e.preventDefault(); learnAfterAnswer(learnState.current.correct); }
                            return;
                        }
                        if (e.key === "Enter") {
                            // confirm written answer
                            e.preventDefault();
                            if (learnState.settings.answerType === "write") checkWritten();
                            return;
                        }
                        if (learnState.settings.answerType === "mc") {
                            const opts = learnState.current.options || [];
                            const i = parseInt(e.key, 10) - 1;
                            if (i >= 0 && i < opts.length && opts[i]) {
                                e.preventDefault();
                                learnPickMC(opts[i]);
                                return;
                            }
                            // A-L letters map to options
                            const idx = "abcdefghijkl".indexOf(e.key.toLowerCase());
                            if (idx >= 0 && idx < opts.length && opts[idx]) {
                                e.preventDefault();
                                learnPickMC(opts[idx]);
                            }
                        }
                        return;
                    }

                    if (state.mode !== "flashcards") return;
                    if (e.key === "ArrowRight") flashNext();
                    else if (e.key === "ArrowLeft") flashPrev();
                    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleFlip(); }
                });

        loadFromStorage();
        initFlashControls();
        renderSidebar();
        switchCategory("all");
    </script>
</body>
</html>
